name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 也允许手动触发

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Sync version from setup_shell_gpt.py to pyproject.toml
        run: |
          # 从 setup_shell_gpt.py 头部抽取 @Version: x.y.z，写回 pyproject.toml
          VERSION=$(grep -oE '@Version:\s*[0-9]+\.[0-9]+\.[0-9]+' setup_shell_gpt.py | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Detected version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "❌ 没能从 setup_shell_gpt.py 抽取到版本号" >&2
            exit 1
          fi
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          echo "--- updated pyproject.toml ---"
          grep '^version' pyproject.toml

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: List built artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
